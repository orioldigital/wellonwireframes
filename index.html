00;font-size:11px;padding:8px 64px;\"\u003ePágina propia de Coffee On — foco SEO. Los 3 servicios core (Café de Especialidad, Máquinas de Café, Fuentes de Agua) ya tienen su página tipo propia.\u003c/div\u003e\n\n  \u003c!-- Header --\u003e\n  \u003cdiv style=\"padding:18px 64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6e6e6;\"\u003e\n    \u003ca href=\"Home.dc.html\" style=\"font-size:20px;font-weight:800;letter-spacing:.04em;\"\u003eWELLON\u003c/a\u003e\n    \u003cnav style=\"display:flex;gap:24px;font-size:12px;\"\u003e\n      \u003ca href=\"We.dc.html\"\u003eWe\u003c/a\u003e\n      \u003ca href=\"CoffeeOn.dc.html\" aria-current=\"page\" style=\"font-weight:700;\"\u003eCoffee On\u003c/a\u003e\n      \u003ca href=\"BreakOn.dc.html\"\u003eBreak On\u003c/a\u003e\n      \u003ca href=\"TeamOn.dc.html\"\u003eTeam On\u003c/a\u003e\n    \u003c/nav\u003e\n    \u003cdiv style=\"display:flex;gap:10px;\"\u003e\n      \u003ca class=\"btn\" href=\"Contacto.dc.html\" style=\"padding:9px 16px;\"\u003eContacto\u003c/a\u003e\n      \u003cdetails class=\"callback\"\u003e\n        \u003csummary class=\"btn\"\u003e\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z\"\u003e\u003c/path\u003e\u003c/svg\u003e¿Te llamamos?\u003c/summary\u003e\n        \u003cdiv class=\"callback-panel\" role=\"group\" aria-label=\"Te llamamos\"\u003e\n          \u003cdiv style=\"font-weight:700;font-size:14px;\"\u003eTe llamamos nosotros\u003c/div\u003e\n          \u003cdiv style=\"font-size:12px;color:#5a5a5a;line-height:1.4;\"\u003eDéjanos tu teléfono y te llamamos en menos de 24\u0026nbsp;h.\u003c/div\u003e\n          \u003cdiv\u003e\u003clabel for=\"cofcbn\"\u003eNombre\u003cspan class=\"req\" aria-hidden=\"true\"\u003e*\u003c/span\u003e\u003c/label\u003e\u003cinput id=\"cofcbn\" type=\"text\" required aria-required=\"true\"\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003clabel for=\"cofcbt\"\u003eTeléfono\u003cspan class=\"req\" aria-hidden=\"true\"\u003e*\u003c/span\u003e\u003c/label\u003e\u003cinput id=\"cofcbt\" type=\"tel\" required aria-required=\"true\"\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003clabel for=\"cofcbf\"\u003e¿Cuándo te va mejor?\u003c/label\u003e\u003cselect id=\"cofcbf\"\u003e\u003coption\u003ePor la mañana\u003c/option\u003e\u003coption\u003ePor la tarde\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n          \u003clabel class=\"check\" for=\"cofcbpriv\"\u003e\u003cinput id=\"cofcbpriv\" type=\"checkbox\" required aria-required=\"true\"\u003e\u003cspan\u003eAcepto la \u003ca href=\"LegalTemplate.dc.html\"\u003epolítica de privacidad\u003c/a\u003e.\u003cspan class=\"req\" aria-hidden=\"true\"\u003e*\u003c/span\u003e\u003c/span\u003e\u003c/label\u003e\n          \u003cbutton type=\"button\" class=\"btnfill\"\u003ePedir llamada\u003c/button\u003e\n          \u003cdiv style=\"font-size:12px;color:#5a5a5a;\"\u003e¿Prefieres llamar tú? \u003ca href=\"tel:911627498\" style=\"text-decoration:underline;\"\u003e911 62 74 98\u003c/a\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/details\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Breadcrumbs --\u003e\n  \u003cnav class=\"bc\" aria-label=\"Breadcrumb\"\u003e\u003col\u003e\u003cli\u003e\u003ca href=\"Home.dc.html\"\u003eInicio\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003cspan aria-current=\"page\"\u003eCoffee On\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/nav\u003e\n\n  \u003c!-- Hero: titular SEO + formulario de presupuesto --\u003e\n  \u003cdiv class=\"section\" style=\"display:fl Template.dc.html\"\u003epolítica de privacidad\u003c/a\u003e.\u003cspan class=\"req\" aria-hidden=\"true\"\u003e*\u003c/span\u003e\u003c/span\u003e\u003c/label\u003e\n      \u003clabel class=\"check\" for=\"bref2com\"\u003e\u003cinput id=\"bref2com\" type=\"checkbox\"\u003e\u003cspan\u003eQuiero recibir novedades y comunicaciones comerciales de Wellon.\u003c/span\u003e\u003c/label\u003e\n      \u003cdiv class=\"req-note\"\u003e\u003cspan class=\"req\"\u003e*\u003c/span\u003e Campos obligatorios\u003c/div\u003e\n      \u003cbutton class=\"btnfill\" style=\"margin-top:6px;\"\u003eSolicitar propuesta\u003c/button\u003e\n      \u003cdiv class=\"next\" aria-label=\"Qué pasa después de enviar\"\u003e\u003cdiv class=\"next-t\"\u003eQué pasa después\u003c/div\u003e\u003col\u003e\u003cli\u003e\u003cspan class=\"n\"\u003e1\u003c/span\u003eTe llamamos en menos de 24\u0026nbsp;h\u003c/li\u003e\u003cli\u003e\u003cspan class=\"n\"\u003e2\u003c/span\u003eAnalizamos tu oficina y tus necesidades\u003c/li\u003e\u003cli\u003e\u003cspan class=\"n\"\u003e3\u003c/span\u003eRecibes tu propuesta a medida\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- FAQ --\u003e\n  \u003cdiv class=\"section\"\u003e\n    \u003cdiv class=\"tag\"\u003ePreguntas frecuentes\u003c/div\u003e\n    \u003cdiv class=\"faq\"\u003e\u003cspan\u003ePregunta 1\u003c/span\u003e\u003cspan\u003e+\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"faq\"\u003e\u003cspan\u003ePregunta 2\u003c/span\u003e\u003cspan\u003e+\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"faq\"\u003e\u003cspan\u003ePregunta 3\u003c/span\u003e\u003cspan\u003e+\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"faq\"\u003e\u003cspan\u003ePregunta 4\u003c/span\u003e\u003cspan\u003e+\u003c/span\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Footer --\u003e\n  \u003cdiv style=\"padding:40px 64px 56px;background:#1a1a1a;color:#cfcfcf;display:grid;grid-template-columns:2fr u003c/script\u003e\n\n\n\u003c/body\u003e\u003c/html\u003e"}, {"file": "TeamOn.dc.html", "title": "Team On", "src": "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eTeam On — Wellon\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cx-dc\u003e\n\u003chelmet\u003e\n\u003cstyle\u003e\nbody{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#1a1a1a}\na{color:inherit;text-decoration:none}\n.section{padding:56px 80px;border-bottom:1px solid #e6e6e6}\n.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#9a9a9a;margin-bottom:10px}\n.img{background:repeating-linear-gradient(45deg,#eee,#eee 8px,#e2e2e2 8px,#e2e2e2 16px);border:1px dashed #bdbdbd;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9a9a9a;text-transform:uppercase;letter-spacing:.05em}\n.btn{border:1px solid #1a1a1a;border-radius:3px;padding:12px 20px;font-size:13px;font-weight:600;background:#fff;display:inline-block}\n.btnfill{border:1px solid #1a1a1a;border-radius:3px;padding:12px 20px;font-size:13px;font-weight:600;background:#1a1a1a;color:#fff;display:inline-block}\n.card{border:1px solid #e2e2e2;border-radius:6px;overflow:hidden;}\n.spec{display:flex;justify-content:space-between;font-size:11px;padding:6px 0;border-top:1px solid #eee;}\n.spec b{font-weight:600;color:#1a1a1a;}\n.spec span{color:#8a8a8a;}\n.step{display:flex;gap:16px;}\n.num{font-size:22px;font-weight:700;color:#d6d6d6;width:40px;flex-shrink:0;}\n.field{display:flex;flex-direction:column;gap:4px;}\n.field label{font-size:11px;color:#8a8a8a;}\n.field input,.field select,.field textarea{border:1px solid #cfcfcf;border-radius:3px;padding:10px 12px;font-size:13px;font-family:inherit;}\n.logo{border:1px solid #e2e2e2;border-radius:3px;height:48px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9a9a9a;}\n/* hover: elementos clicables */\na,button{transition:opacity .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease}\nbutton{cursor:pointer}\na:hover{opacity:.6}\na.btn:hover,button.btn:hover{opacity:1;background:#efefec}\na.btnfill:hover,button.btnfill:hover{opacity:.8}\na.card:hover,a.blog:hover,a.post:hover,a.node:hover,a[style*=\"border:1px solid\"]:hover{opacity:1;border-color:currentColor !important;box-shadow:0 8px 20px rgba(0,0,0,.08);transform:translateY(-2px)}\n/* breadcrumbs */\n.bc{padding:12px 64px;border-bottom:1px solid #e6e6e6;background:#fafafa}\n.bc ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:#5f5f5f}\n.bc li{display:flex;align-items:center;gap:8px}\n.bc li+li::before{content:\"›\";color:#a8a8a8;font-size:14px}\n.bc a{color:#4a4a4a;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#c4c4c4}\n.bc a:hover{opacity:1;color:#1a1a1a;text-decoration-color:#1a1a1a}\n.bc [aria-current=\"page\"]{color:#1a1a1a;font-weight:600}\n/* callback: ¿Te llamamos? */\n.callback{position:relative}\n.callback summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:9px 16px}\n.callback summary::-webkit-details-marker{display:none}\n.callback summary:hover{background:#efefec}\n.callback[open] summary{background:#1a1a1a;color:#fff}\n.callback-panel{position:absolute;right:0;top:calc(100% + 8px);width:300px;box-sizing:border-box;background:#fff;color:#1a1a1a;border:1px solid #d9d9d9;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:20px;display:flex;flex-direction:column;gap:12px;z-index:50;text-align:left;font-weight:400}\n.callback-panel label{display:block;font-size:11px;color:#4a4a4a;margin-bottom:4px}\n.callback-panel input,.callback-panel select{width:100%;box-sizing:border-box;border:1px solid #cfcfcf;border-radius:3px;padding:9px 10px;font-size:13px;font-family:inherit;background: le=\"padding:18px 64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6e6e6;\"\u003e\n    \u003ca href=\"Home.dc.html\" style=\"font-size:20px;font-weight:800;letter-spacing:.04em;\"\u003eWELLON\u003c/a\u003e\n    \u003cnav style=\"display:flex;gap:24px;font-size:12px;\"\u003e\n      \u003ca href=\"We.dc.html\"\u003eWe\u003c/a\u003e\n      \u003ca href=\"CoffeeOn.dc.html\"\u003eCoffee On\u003c/a\u003e\n      \u003ca href=\"BreakOn.dc.html\"\u003eBreak On\u003c/a\u003e\n      \u003ca href=\"TeamOn.dc.html\" aria-current=\"page\" style=\"font-weight:700;\"\u003eTeam On\u003c/a\u003e\n    \u003c/nav\u003e\n    \u003cdiv style=\"display:flex;gap:10px;\"\u003e\n      \u003ca class=\"btn\" href=\"Contacto.dc.html\" style=\"padding:9px 16px;\"\u003eContacto\u003c/a\u003e\n      \u003cdetails class=\"callback\"\u003e\n        \u003csummary class=\"btn\"\u003e\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z\"\u003e\u003c/path\u003e\u003c/svg\u003e¿Te llamamos?\u003c/summary\u003e\n        \u003cdiv class=\"callback-panel\" role=\"group\" aria-label=\"Te llamamos\"\u003e\n          \u003cdiv style=\"font-weight:700;font-size:14px;\"\u003eTe llamamos nosotros\u003c/div\u003e\n          \u003cdiv style=\"font-size:12px;color:#5a5a5a;line-height:1.4;\"\u003eDéjanos tu teléfono y te llamamos en menos de 24\u0026nbsp;h.\u003c/div\u003e\n          \u003cdiv\u003e\u003clabel for=\"teacbn\"\u003eNombre\u003cspan class=\"req\" aria-hidden=\"true\"\u003e*\u003c/span\u003e\u003c/label\u003e\u003cinput id=\"teacbn\" type=\"text\" required aria-required=\"true\"\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003clabel for=\"teacbt\"\u003eTeléfono\u003cspan class=\"req\" aria-hidden=\"true\"\u003e*\u003c/span\u003e\u003c/label\u003e\u003cinput id=\"teacbt\" type=\"tel\" required aria-required=\"true\"\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003clabel for=\"teacbf\"\u003e¿Cuándo te va mejor?\u003c/label\u003e\u003cselect id=\"teacbf\"\u003e\u003coption\u003ePor la mañana\u003c/option\u003e\u003coption\u003ePor la tarde\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n          \u003clabel class=\"check\" for=\"teacbpriv\"\u003e\u003cinput id=\"teacbpriv\" type=\"checkbox\" required aria-required=\"true\"\u003e\u003cspan\u003eAcepto la \u003ca href=\"LegalTemplate.dc.html\"\u003epolítica de privacidad\u003c/a\u003e.\u003cspan class=\"req\" aria-hidden=\"true\"\u003e*\u003c/span\u003e\u003c/span\u003e\u003c/label\u003e\n          \u003cbutton type=\"button\" class=\"btnfill\"\u003ePedir llamada\u003c/button\u003e\n          \u003cdiv style=\"font-size:12px;color:#5a5a5a;\"\u003e¿Prefieres llamar tú? \u003ca href=\"tel:911627498\" style=\"text-decoration:underline;\"\u003e911 62 74 98\u003c/a\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/details\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Breadcrumbs --\u003e\n  \u003cnav class=\"bc\" aria-label=\"Breadcrumb\"\u003e\u003col\u003e\u003cli\u003e\u003ca href=\"Home.dc.html\"\u003eInicio\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003cspan aria-current=\"page\"\u003eTeam On\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/nav\u003e\n\n  \u003c!-- Hero --\u003e\n  \u003cdiv class=\"section\" style=\"text-align:center;padding-top:72px;padding-bottom:72px;\"\u003e\n    \u003ch1 style=\"margin:0 auto 20px;font-size:38px;line-height:1.2;max-width:680px;\"\u003eMomentos que ayudan a que el trabajo fluya mejor.\u003c/h1\u003e\n    \u003cp style=\"margin:0 auto 28px;font-size:15px;color:#5a5a5a;max-width:560px;\"\u003eDiseñamos eventos, sesiones y dinámicas adaptadas a cada equipo para mejorar la colaboración, la energía y la forma de trabajar juntos.\u003c/p\u003e\n    \u003ca class=\"btnfill\" href=\"#form3\"\u003eSolicitar propuesta\u003c/a\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Formatos de servicio --\u003e\n  \u003cdiv class=\"section\"\u003e\n    \n    \n    \n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;\"\u003e\n\n      \u003cdiv class=\"card\"\u003e\n        \u003cdiv class=\"img\" style=\"height:140px;\"\u003eIMG\u003c/div\u003e\n        \u003cdiv style=\"padding:20px;\"\u003e\n          \u003cdiv class=\"tag\"\u003eEventos\u003c/div\u003e\n          \u003cdiv style=\"font-weight:700;font-size:15px;margin-bottom:10px;\"\u003eEventos Corporativos\u003c/div\u003e\n          \u003cdiv style=\"font-size:12px;color:#7a7a7a;margin-bottom:12px;\"\u003eEventos diseñados a medida para celebrar, comunicar o reunir al equipo, desde una jornada interna hasta una convención.\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eFormato\u003c/b\u003e\u003cspan\u003eEvento a medida\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eDuración\u003c/b\u003e\u003cspan\u003eMedio día / día completo\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003ePúblico\u003c/b\u003e\u003cspan\u003eA determinar\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eModalidad\u003c/b\u003e\u003cspan\u003ePresencial\u003c/span\u003e\u003c/div\u003e\n          \u003ca href=\"#form3\" style=\"display:block;margin-top:14px;font-size:12px;font-weight:600;\"\u003eSolicitar propuesta →\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"card\"\u003e\n        \u003cdiv class=\"img\" style=\"height:140px;\"\u003eIMG\u003c/div\u003e\n        \u003cdiv style=\"padding:20px;\"\u003e\n          \u003cdiv class=\"tag\"\u003eTeam Building\u003c/div\u003e\n          \u003cdiv style=\"font-weight:700;font-size:15px;margin-bottom:10px;\"\u003eTeam building\u003c/div\u003e\n          \u003cdiv style=\"font-size:12px;color:#7a7a7a;margin-bottom:12px;\"\u003eDinámicas de equipo pensadas para reforzar la cohesión, la confianza y la colaboración entre compañeros.\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eFormato\u003c/b\u003e\u003cspan\u003eDinámica de equipo\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eDuración\u003c/b\u003e\u003cspan\u003eMedia jornada\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003ePúblico\u003c/b\u003e\u003cspan\u003e12–25 personas\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eModalidad\u003c/b\u003e\u003cspan\u003ePresencial\u003c/span\u003e\u003c/div\u003e\n          \u003ca href=\"#form3\" style=\"display:block;margin-top:14px;font-size:12px;font-weight:600;\"\u003eSolicitar propuesta →\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"card\"\u003e\n        \u003cdiv class=\"img\" style=\"height:140px;\"\u003eIMG\u003c/div\u003e\n        \u003cdiv style=\"padding:20px;\"\u003e\n          \u003cdiv class=\"tag\"\u003eCoaching\u003c/div\u003e\n          \u003cdiv style=\"font-weight:700;font-size:15px;margin-bottom:10px;\"\u003eCoaching ejecutivo\u003c/div\u003e\n          \u003cdiv style=\"font-size:12px;color:#7a7a7a;margin-bottom:12px;\"\u003eSesiones individuales con líderes o miembros del equipo para resolver bloqueos y ganar seguridad comunicativa.\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eFormato\u003c/b\u003e\u003cspan\u003eSesiones 1:1\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eDuración\u003c/b\u003e\u003cspan\u003e6–10 sesiones\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003ePúblico\u003c/b\u003e\u003cspan\u003ePerfiles directivos\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"spec\"\u003e\u003cb\u003eModalidad\u003c/b\u003e\u003cspan\u003ePresencial u online\u003c/span\u003e\u003c/div\u003e\n          \u003ca href=\"#form3\" style=\"display:block;margin-top:14px;font-size:12px;font-weight:600;\"\u003eSolicitar propuesta →\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Cómo trabajamos con tu equipo --\u003e\n  \u003cdiv class=\"section\" style=\"background:#fafafa;\"\u003e\n    \u003cdiv class=\"tag\"\u003eCómo trabajamos con tu equipo\u003c/div\u003e\n    \u003ch2 style=\"margin:0 0 28px;font-size:22px;\"\u003eUn proceso en cuatro pasos\u003c/h2\u003e\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px;\"\u003e\n      \u003cdiv class=\"step\"\u003e\u003cdiv class=\"num\"\u003e01\u003c/div\u003e\u003cdiv\u003e\u003cdiv style=\"font-weight:600;font-size:14px;margin-bottom:6px;\"\u003eAnálisis y diagnóstico de la necesidad\u003c/div\u003e\u003cdiv style=\"font-size:12px;color:#8a8a8a;\"\u003ePrimera conversación con dirección o RRHH para entender qué situación motiva la consulta y qué cambio se busca.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"step\"\u003e\u003cdiv class=\"num\"\u003e02\u003c/div\u003e\u003cdiv\u003e\u003cdiv style=\"font-weight:600;font-size:14px;margin-bottom:6px;\"\u003eElección del formato\u003c/div\u003e\u003cdiv style=\"font-size:12px;color:#8a8a8a;\"\u003eA partir del diagnóstico, definimos conferencia, workshop o coaching, y el nivel de profundidad.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"step\"\u003e\u003cdiv class=\"num\"\u003e03\u003c/div\u003e\u003cdiv\u003e\u003cdiv style=\"font-weight:600;font-size:14px;margin-bottom:6px;\"\u003eAplicación al trabajo diario\u003c/div\u003e\u003cdiv style= tml\"\u003eTeam On\u003c/a\u003e\n    \u003c/nav\u003e\n    \u003ca class=\"btn\" href=\"Contacto.dc.html\" style=\"padding:9px 16px;\"\u003eContacto\u003c/a\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Breadcrumbs --\u003e\n  \u003cnav class=\"bc\" aria-label=\"Breadcrumb\"\u003e\u003col\u003e\u003cli\u003e\u003ca href=\"Home.dc.html\"\u003eInicio\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"Blog.dc.html\"\u003eBlog\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003cspan aria-current=\"page\"\u003eCómo elegir la cafetera ideal para tu oficina\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/nav\u003e\n\n  \u003c!-- 1. Cabecera del artículo --\u003e\n  \u003cdiv style=\"padding:56px 0 32px;\"\u003e\n    \u003cdiv class=\"art-head\"\u003e\n      \u003ca class=\"art-cat\" href=\"Blog.dc.html\"\u003eCafé en la oficina\u003c/a\u003e\n      \u003ch1 style=\"margin:0 0 16px;font-size:44px;line-height:1.12;letter-spacing:-.01em;\"\u003eCómo elegir la cafetera ideal para tu oficina\u003c/h1\u003e\n      \u003cp style=\"margin:0 0 28px;font-size:20px;line-height:1.5;color:#4a4a4a;\"\u003eTamaño del equipo, tipo de café y presupuesto: las tres preguntas que conviene responder antes de decidir.\u003c/p\u003e\n      \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:20px;border-top:1px solid #e2e2e2;\"\u003e\n        \u003cdiv class=\"meta\"\u003e\n          \u003cdiv class=\"avatar\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdiv style=\"font-weight:600;color:#1a1a1a;\"\u003eMarta Soler\u003c/div\u003e\u003cdiv style=\"font-size:12px;\"\u003ePublicado el 12 sep 2026 · Actualizado el 20 sep 2026 · 6 min de lectura\u003c/div\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"share\" aria-label=\"Compartir\"\u003e\u003ca href=\"#\"\u003eLinkedIn\u003c/a\u003e\u003ca href=\"#\"\u003eEmail\u003c/a\u003e\u003ca href=\"#\"\u003eCopiar enlace\u003c/a\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- 2. Imagen principal --\u003e\n  \u003cdiv class=\"art-wrap\" style=\"margin-bottom:56px;\"\u003e\n    \u003cfigure style=\"margin:0;\"\u003e\n      \u003cdiv class=\"img\" style=\"width:100%;aspect-ratio:16/9;border-radius:8px;\"\u003eIMG principal 16:9\u003c/div\u003e\n      \u003cfigcaption style=\"font-size:13px;color:#5a5a5a;margin-top:8px;\"\u003ePie de foto: descripción breve de la imagen y créditos.\u003c/figcaption\u003e\n    \u003c/figure\u003e\n  \u003c/div\u003e\n\n  \u003c!-- 3. Índice + cuerpo --\u003e\n  \u003cdiv class=\"art-wrap\" style=\"padding-bottom:64px;\"\u003e\n    \u003cdiv class=\"art-grid\"\u003e\n      \u003caside class=\"toc\" aria-label=\"Índice del artículo\"\u003e\n        \u003cdiv class=\"toc-t\"\u003eEn este artículo\u003c/div\u003e\n        \u003col\u003e\n          \u003cli\u003e\u003ca href=\"#s1\" class=\"on\"\u003eAntes de elegir: qué necesita tu oficina\u003c/a\u003e\u003c/li\u003e\n          \u003cli\u003e\u003ca href=\"#s2\"\u003eTipos de cafetera para empresas\u003c/a\u003e\u003c/li\u003e\n          \u003cli\u003e\u003ca href=\"#s3\"\u003eRenting o compra: cómo decidir\u003c/a\u003e\u003c/li\u003e\n          \u003cli\u003e\u003ca href=\"#s4\"\u003eConclusión\u003c/a\u003e\u003c/li\u003e\n        \u003c/ol\u003e\n      \u003c/aside\u003e\n\n      \u003carticle class=\"prose\"\u003e\n        \u003cp class=\"lead\"\u003eElegir cafetera para la oficina no va de encontrar la mejor máquina del mercado, sino la que encaja con tu equipo. Una buena elección se nota cada mañana; una mala, también.\u003c/p\u003e\n\n        \u003ch2 id=\"s1\"\u003eAntes de elegir: qué necesita tu oficina\u003c/h2\u003e\n        \u003cp\u003eAntes de comparar modelos, conviene tener claras tres cosas: cuántas personas toman café a diario, qué bebidas piden y cuánto espacio hay en el office. Con esas respuestas, la lista de opciones se reduce mucho.\u003c/p\u003e\n        \u003ch3\u003eCuántas tazas al día\u003c/h3\u003e\n        \u003cp\u003eUna oficina de 15 personas no necesita lo mismo que una de 80. Calcula una media de dos o tres cafés por persona y día para estimar la capacidad que necesitas.\u003c/p\u003e\n        \u003ch3\u003eQué bebidas pide el equipo\u003c/h3\u003e\n        \u003cul\u003e\n          \u003cli\u003eSolo espresso y americano: una máquina compacta es suficiente.\u003c/li\u003e\n          \u003cli\u003eBebidas con leche: busca un sistema de leche automático y fácil de limpiar.\u003c/li\u003e\n          \u003cli\u003eOpciones sin cafeína o té: valora una máquina con varias tolvas.\u003c/li\u003e\n        \u003c/ul\u003e\n        \u003cdiv class=\"tip\"\u003e\u003cdiv class=\"tip-t\"\u003eConsejo\u003c/div\u003eHaz una encuesta rápida al equipo antes de decidir. Dos preguntas bastan: cuántos cafés toman y cuál es su bebida habitual.\u003c/div\u003e\n\n        \u003ch2 id=\"s2\"\u003eTipos de cafetera para empresas\u003c/h2\u003e\n        \u003cp\u003eLas cafeteras de grano automáticas son las más habituales en oficinas medianas: muelen al momento y el resultado es mucho mejor que el de las cápsulas. Para equipos grandes, las máquinas de alta capacidad aguantan picos de uso sin perder calidad.\u003c/p\u003e\n        \u003cfigure\u003e\n          \u003cdiv class=\"img\" style=\"width:100%;aspect-ratio:3/2;border-radius:6px;\"\u003eIMG secundaria\u003c/div\u003e\n          \u003cfigcaption\u003ePie de foto: una cafetera de grano en el office de una oficina de 40 personas.\u003c/figcaption\u003e\n        \u003c/figure\u003e\n        \u003cblockquote\u003e“El café es de las pocas cosas que todo el equipo usa cada día. Merece la pena elegir bien.”\u003ccite\u003e— Marta Soler, Coffee Specialist en Wellon\u003c/cite\u003e\u003c/blockquote\u003e\n\n        \u003cdiv class=\"inline-cta\"\u003e\n          \u003cdiv\u003e\u003cdiv style=\"font-weight:700;font-size:16px;margin-bottom:4px;\"\u003e¿Buscas cafetera para tu oficina?\u003c/div\u003e\u003cdiv style=\"font-size:14px;color:#5a5a5a;line-height:1.45;\"\u003eTe ayudamos a elegir entre renting y compra según tu equipo.\u003c/div\u003e\u003c/div\u003e\n          \u003ca class=\"btnfill\" href=\"MaquinasDeCafe.dc.html\" style=\"flex:none;\"\u003eVer máquinas de café\u003c/a\u003e\n        \u003c/div\u003e\n\n        \u003ch2 id=\"s3\"\u003eRenting o compra: cómo decidir\u003c/h2\u003e\n        \u003cp\u003eEl renting evita la inversión inicial e incluye mantenimiento y reposición en una cuota mensual. La compra tiene sentido si prefieres tener la máquina en propiedad y ya cuentas con un servicio técnico.\u003c/p\u003e\n        \u003col class=\"num\"\u003e\n          \u003cli\u003eCalcula cuánto usarás la máquina en los próximos tres años.\u003c/li\u003e\n          \u003cli\u003eCompara la cuota de renting con el precio de compra más el mantenimiento.\u003c/li\u003e\n          \u003cli\u003eValora quién se ocupará de las reparaciones y la reposición.\u003c/li\u003e\n        \u003c/ol\u003e\n\n        \u003ch2 id=\"s4\"\u003eConclusión\u003c/h2\u003e\n        \u003cp\u003eNo hay una cafetera perfecta para todas las oficinas, pero sí una adecuada para la tuya. Parte del tamaño del equipo y de lo que bebe, y decide después el modelo y la modalidad.\u003c/p\u003e\n\n        \u003cdiv class=\"tags\" aria-label=\"Etiquetas\"\u003e\u003ca href=\"Blog.dc.html\"\u003eCafeteras\u003c/a\u003e\u003ca href=\"Blog.dc.html\"\u003eRenting\u003c/a\u003e\u003ca href=\"Blog.dc.html\"\u003eOficina\u003c/a\u003e\u003ca href=\"Blog.dc.html\"\u003eCafé de especialidad\u003c/a\u003e\u003c/div\u003e\n\n        \u003cdiv class=\"bio\"\u003e\n          \u003cdiv class=\"avatar\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdiv style=\"font-weight:700;font-size:15px;margin-bottom:4px;\"\u003eMarta Soler\u003c/div\u003e\u003cdiv style=\"font-size:14px;color:#5a5a5a;line-height:1.5;\"\u003eCoffee Specialist en Wellon. [Bio breve del autor: experiencia y especialidad, 1–2 líneas.]\u003c/div\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- 4. Artículos relacionados --\u003e\n  \u003cdiv class=\"section\" style=\"background:#fafafa;\"\u003e\n    \u003cdiv style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;\"\u003e\n      \u003ch2 style=\"margin:0;font-size:24px;\"\u003eArtículos relacionados\u003c/h2\u003e\n      \u003ca href=\"Blog.dc.html\" style=\"font-size:13px;font-weight:600;\"\u003eVer todo el blog →\u003c/a\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;\"\u003e\n      \u003ca class=\"post\" href=\"BlogPost.dc.html\"\u003e\n        \u003cdiv class=\"img\" style=\"height:150px;\"\u003eIMG\u003c/div\u003e\n        \u003cdiv style=\"padding:16px;\"\u003e\n          \u003cdiv style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5a5a5a;margin-bottom:6px;\"\u003eCafé\u003c/div\u003e\n          \u003cdiv style=\"font-weight:700;font-size:15px;line-height:1.35;margin-bottom:8px;\"\u003e5 errores al montar el office de tu empresa\u003c/div\u003e\n          \u003cdiv style=\"font-size:12px;color:#6a6a6a;\"\u003e12 sep 2026 · 4 min\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/a\u003e\n      \u003ca class=\"post\" href=\"BlogPost.dc.html\"\u003e\n        \u003cdiv class=\"img\" style=\"height:150px;\"\u003eIMG\u003c/div\u003e\n        \u003cdiv style=\"padding:16px;\"\u003e\n          \u003cdiv style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5a5a5a;margin-bottom:6px;\"\u003eCafé\u003c/div\u003e\n          \u003cdiv style=\"font-weight:700;font-size:15px;line-height:1.35;margin-bottom:8px;\"\u003eCafé de especialidad: qué es y por qué se nota\u003c/div\u003e\n          \u003cdiv style=\"font-size:12px;color:#6a6a6a;\" cdiv class=\"tag\"\u003eLa mejor fruta en tu oficina\u003c/div\u003e\n      \u003ch2 style=\"margin:0 0 12px;font-size:24px;\"\u003ePausas saludables que recargan la energía del equipo\u003c/h2\u003e\n      \u003cp style=\"margin:0;font-size:14px;color:#6a6a6a;line-height:1.6;\"\u003eSeleccionamos fruta de temporada y cuidamos cada entrega para que siempre esté en su mejor momento. Nos anticipamos a la reposición para que nunca falte una opción fresca cuando el equipo necesita una pausa.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"img\" style=\"flex:1;height:260px;\"\u003eIMG — fruta fresca\u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Destacado: construye tu corner --\u003e\n  \u003cdiv class=\"section\" style=\"background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:48px;\"\u003e\n    \u003cdiv class=\"img\" style=\"flex:1;height:220px;background:#2a2a2a;border-color:#3a3a3a;color:#7a7a7a;\"\u003eIMG — corner de fruta\u003c/div\u003e\n    \u003cdiv style=\"flex:1;\"\u003e\n      \n      \u003ch2 style=\"margin:0 0 12px;font-size:24px;\"\u003eConstruye tu corner\u003c/h2\u003e\n      \u003cp style=\"margin:0 0 20px;font-size:13px;color:#c9c9c9;max-width:420px;\"\u003eDiseñamos el rincón de fruta de tu oficina: cestas, expositores y formato, adaptados al espacio y al tamaño del equipo.\u003c/p\u003e\n      \u003ca class=\"btnfill\" href=\"#form-lead\" style=\"background:#fff;color:#1a1a1a;border-color:#fff;\"\u003eSolicitar propuesta\u003c/a\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Carrusel de imágenes --\u003e\n  \u003cdiv class=\"section\"\u003e\n    \u003cdiv class=\"tag\"\u003eFruta Fresca en la oficina\u003c/div\u003e\n    \u003cdiv style=\"display:flex;gap:16px;overflow-x:auto;\"\u003e\n      \u003cdiv class=\"img\" style=\"width: 244px; height: 327px; flex-shrink: 0\"\u003eIMG\u003c/div\u003e\n      \u003cdiv class=\"img\" style=\"width: 244px; height: 327px; flex-shrink: 0\"\u003eIMG\u003c/div\u003e\n <script>
(function(){
  var D=JSON.parse(document.getElementById('dc-data').textContent);
  var rtText=D.runtime;
  var rtUrl=URL.createObjectURL(new Blob([rtText],{type:'text/javascript'}));
  var byFile={}; D.pages.forEach(function(p,i){p.i=i;byFile[p.file]=p;});

  D.groups.forEach(function(g){

    g[1].forEach(function(f){var b=document.createElement('button');b.type='button';b.textContent=byFile[f].title;b.dataset.file=f;b.onclick=function(){show(f);};list.appendChild(b);});
  });

      doc.addEventListener('click',function(e){
        var a=e.target.closest&&e.target.closest('a[href]'); if(!a) return;
